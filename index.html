<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Problem App – Math Adventure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b3d5f, #1b6b9a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: linear-gradient(160deg, #fffde7, #fff8e1);
            border-radius: 32px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            padding: 35px 30px;
            border: 3px solid #cc9c3e;
            text-align: center;
            position: relative;
        }
        h1 { color: #6b3e1a; text-shadow: 3px 3px 0 #f3cd81; }
        .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; font-size: 1.05em; margin: 0 4px; }
        .fraction .numerator { border-bottom: 2.5px solid currentColor; padding: 1px 5px; font-weight: bold; }
        .fraction .denominator { padding: 2px 5px; font-weight: bold; }
        .mixed-number { display: inline-flex; align-items: center; gap: 3px; margin: 0 4px; }
        .mixed-number .whole { font-weight: bold; }
        .power-expr sup { font-size: 0.7em; font-weight: bold; color: #8b2500; vertical-align: super; }
        .progress-track { width:100%; height:52px; background:linear-gradient(90deg,#d2b48c,#a0714f); border-radius:26px; margin:22px 0 8px; position:relative; border:2.5px solid #6b4c2a; }
        .progress-fill { height:100%; border-radius:26px; background:linear-gradient(90deg,#4db8ff,#0077cc); transition:width 0.8s; position:absolute; left:0; opacity:0.55; }
        .ship-icon { position:absolute; top:-38px; font-size:40px; transition:left 0.9s; z-index:3; }
        .treasure-icon { position:absolute; right:10px; top:-26px; font-size:32px; animation: bounce 1.5s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
        .question-box { background:rgba(255,255,255,0.92); border:2.5px dashed #b8860b; border-radius:22px; padding:22px 25px; margin:0 0 18px; font-size:1.2rem; color:#2e1e0f; line-height:2; min-height:90px; display:flex; align-items:center; justify-content:center; position:relative; }
        .question-box .q-number { position:absolute; top:-14px; left:20px; background:#daa520; color:white; font-size:0.85rem; font-weight:bold; padding:2px 12px; border-radius:20px; }
        .answer-row { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
        input[type="text"] { font-size:1.2rem; padding:12px 20px; border-radius:50px; border:2.5px solid #b8860b; background:#fffef0; width:200px; text-align:center; outline:none; }
        .btn { background:linear-gradient(180deg,#f0b429,#daa520); border:none; color:#fff; font-weight:bold; font-size:1.1rem; padding:13px 28px; border-radius:50px; cursor:pointer; box-shadow:0 5px 0 #8b6508; }
        .btn-skip { background:linear-gradient(180deg,#b0bec5,#90a4ae); box-shadow:0 5px 0 #546e7a; }
        .restart-btn { background:linear-gradient(180deg,#a0694a,#8b5a2b); box-shadow:0 5px 0 #5a3512; color:#ffd700; margin-top:10px; }
        .message { font-size:1.15rem; min-height:38px; margin:6px 0; font-weight:bold; }
        .hint-box { background:rgba(255,249,196,0.95); border:2px solid #f9a825; border-radius:14px; padding:10px 16px; display:none; text-align:left; }
        .hint-toggle { background:none; border:1.5px solid #f9a825; border-radius:20px; padding:5px 14px; cursor:pointer; color:#7b5800; font-weight:bold; margin-bottom:10px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px); background:#333; color:#fff; padding:12px 24px; border-radius:30px; z-index:999; opacity:0; transition:all 0.4s; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .code-chip { display:inline-block; background:#daa520; color:white; border-radius:20px; padding:4px 12px; font-weight:bold; font-size:0.9rem; margin:3px; cursor:pointer; }
    </style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="container" id="app">
    <div id="codeScreen">
        <h1>🏴‍☠️ Word Problem Adventure</h1>
        <p style="font-size:1.2rem; margin:20px 0;">Enter worksheet code:</p>
        <input type="text" id="codeInput" placeholder="e.g. FRAC1" autocomplete="off" style="font-size:1.3rem; width:220px; margin-bottom:14px;">
        <br>
        <button class="btn" id="activateBtn">⚓ Set Sail!</button>
        <p id="codeError" style="color:#c62828; margin-top:12px; font-weight:bold; min-height:24px;"></p>
        <div style="margin-top:20px; font-size:0.9rem; color:#5a3e1a;">
            <strong>Available codes:</strong><br>
            <span class="code-chip" onclick="useCode('FRAC1')">FRAC1</span>
            <span class="code-chip" onclick="useCode('FRAC2')">FRAC2</span>
            <span class="code-chip" onclick="useCode('RATE1')">RATE1</span>
            <span class="code-chip" onclick="useCode('RATE2')">RATE2</span>
            <span class="code-chip" onclick="useCode('RATE3')">RATE3</span>
            <span class="code-chip" onclick="useCode('ALGE1')">ALGE1</span>
            <span class="code-chip" onclick="useCode('ALGF1')">ALGF1</span>
            <span class="code-chip" onclick="useCode('ALGF2')">ALGF2</span>
            <span class="code-chip" onclick="useCode('ALGF3')">ALGF3</span>
            <br><small>Click a code, then press Set Sail!</small>
        </div>
    </div>
    <div id="gameScreen" style="display:none;">
        <h1 id="gameTitle"></h1>
        <div class="progress-track" id="progressContainer">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
            <span class="ship-icon" id="shipIcon">⛵</span>
            <span class="treasure-icon">💎</span>
        </div>
        <div class="hud">
            <span id="questionCounter"></span>
            <span class="score-badge" id="scoreDisplay"></span>
        </div>
        <div class="question-box" id="questionBox">
            <span class="q-number" id="qLabel"></span>
            <span id="questionText"></span>
        </div>
        <p class="format-hint" id="formatHint"></p>
        <button class="hint-toggle" id="hintToggle" style="display:none;">💡 Show Hint</button>
        <div class="hint-box" id="hintBox"></div>
        <div class="answer-row">
            <input type="text" id="answerInput" placeholder="Your answer">
            <button class="btn" id="submitBtn">⚓ Check</button>
            <button class="btn btn-skip" id="skipBtn">⏭ Skip</button>
        </div>
        <div class="message info" id="feedback"></div>
        <p class="skip-tally" id="skipTally"></p>
        <button class="btn restart-btn" id="restartBtn" style="display:none;">🔄 Try Another</button>
    </div>
</div>

<script>
(function(){
    // ===================== CONFIG =====================
    const GITHUB_USER = "WK-Enjie";
    const GITHUB_REPO = "word-problem-app";
    const WORKSHEET_PATH = "worksheets";
    const BRANCH = "main";

    // ===================== GAME STATE =====================
    let problems=[], totalQ=0, currentIndex=0, score=0, skipped=0, gameActive=false;

    const codeScreen=document.getElementById('codeScreen'), gameScreen=document.getElementById('gameScreen');
    const codeInput=document.getElementById('codeInput'), codeError=document.getElementById('codeError');
    const gameTitle=document.getElementById('gameTitle'), qText=document.getElementById('questionText');
    const answerInput=document.getElementById('answerInput'), submitBtn=document.getElementById('submitBtn');
    const skipBtn=document.getElementById('skipBtn'), feedback=document.getElementById('feedback');
    const ship=document.getElementById('shipIcon'), progressFill=document.getElementById('progressFill');
    const restartBtn=document.getElementById('restartBtn'), formatHint=document.getElementById('formatHint');
    const hintToggle=document.getElementById('hintToggle'), hintBox=document.getElementById('hintBox');
    const skipTally=document.getElementById('skipTally'), toast=document.getElementById('toast');

    // ===================== RENDER MATH =====================
    function renderMath(text) {
        if (!text) return '';
        text = text.replace(/\{\{F:(-?\d+),(-?\d+)\}\}/g, (_, n, d) => `<span class="fraction"><span class="numerator">${n}</span><span class="denominator">${d}</span></span>`);
        text = text.replace(/\{\{M:(-?\d+),(-?\d+),(-?\d+)\}\}/g, (_, w, n, d) => `<span class="mixed-number"><span class="whole">${w}</span><span class="fraction"><span class="numerator">${n}</span><span class="denominator">${d}</span></span></span>`);
        text = text.replace(/\{\{P:([^,]+),([^}]+)\}\}/g, (_, base, exp) => `<span class="power-expr">${base}<sup>${exp}</sup></span>`);
        text = text.replace(/\{\{SQ:([^}]+)\}\}/g, (_, expr) => `<span style="font-size:1.1em;">√${expr}</span>`);
        text = text.replace(/\{\{(\d+),(\d+)\}\}/g, (_, n, d) => `<span class="fraction"><span class="numerator">${n}</span><span class="denominator">${d}</span></span>`);
        return text;
    }

    // ===================== ANSWER PARSING (FIXED) =====================
    function parseAnswer(raw) {
        let s = String(raw).trim().replace(/\s+/g, ' ');
        if (!s) return NaN;
        // If it contains letters or operators (besides leading sign), treat as algebra
        if (/[a-zA-Z]/.test(s) || /[+\-*/=^]/.test(s.replace(/^[-+]/, ''))) {
            return NaN;
        }
        if (s.endsWith('%')) { const p = parseFloat(s); return isNaN(p)?NaN:p/100; }
        if (/^\d{1,2}:\d{2}$/.test(s)) { const [h,m]=s.split(':').map(Number); return h + m/60; }
        const mixed = s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
        if (mixed) { const w=parseInt(mixed[1]), n=parseInt(mixed[2]), d=parseInt(mixed[3]); if(d===0)return NaN; return w<0? w - n/d : w + n/d; }
        if (s.includes('/')) { const [n,d]=s.split('/').map(Number); if(isNaN(n)||isNaN(d)||d===0)return NaN; return n/d; }
        return parseFloat(s);
    }

    // ===================== ROBUST NORMALISATION =====================
    function normalizeAlgebra(expr) {
        if (!expr) return expr;
        let s = expr.trim().toLowerCase().replace(/\s+/g, '');
        if (!s) return s;
        // 1. Binomial sum/difference (linear)
        const terms = s.match(/[+-]?\d*\.?\d*x?/g);
        if (terms && terms.length === 2) {
            let varTerm = null, constTerm = null;
            terms.forEach(t => {
                if (t.includes('x')) varTerm = t;
                else constTerm = t;
            });
            if (varTerm && constTerm) {
                let coeffStr = varTerm.replace('x', '');
                let coeff = 1;
                if (coeffStr === '' || coeffStr === '+') coeff = 1;
                else if (coeffStr === '-') coeff = -1;
                else coeff = parseFloat(coeffStr);
                const constVal = parseFloat(constTerm);
                let normalised = '';
                if (coeff === 1) normalised = 'x';
                else if (coeff === -1) normalised = '-x';
                else if (coeff > 0) normalised = coeff + 'x';
                else normalised = coeff + 'x';
                if (constVal > 0) normalised += '+' + constVal;
                else if (constVal < 0) normalised += constVal;
                else normalised += '+0';
                return normalised;
            }
        }
        // 2. Product of factors – sort brackets
        const leadingMatch = s.match(/^([\d.]*x?)(\(.*\)[\(\)\dx]*)$/);
        let leading = '';
        let rest = s;
        if (leadingMatch) { leading = leadingMatch[1]; rest = leadingMatch[2]; }
        const bracketParts = rest.match(/\([^()]+\)/g);
        if (bracketParts && bracketParts.length > 0) {
            bracketParts.sort();
            let sortedFactors = bracketParts.join('');
            if (leading) sortedFactors = leading + sortedFactors;
            return sortedFactors;
        }
        // 3. Fallback
        return s;
    }

    // ===================== ANSWER MATCHING (with DEBUG) =====================
    function answersMatch(user, correct, tol=0.001) {
        const u = parseAnswer(user), c = parseAnswer(correct);
        if (!isNaN(u) && !isNaN(c)) return Math.abs(u - c) <= tol;

        const normUser = normalizeAlgebra(user);
        const normCorrect = normalizeAlgebra(correct);
        
        // DEBUG: show what's being compared
        alert("User input: " + user + "\nNormalised: " + normUser + 
              "\n\nCorrect answer: " + correct + "\nNormalised: " + normCorrect +
              "\n\nMatch: " + (normUser === normCorrect));
        
        return normUser === normCorrect;
    }

    // ===================== PROGRESS & GAME =====================
    function updateProgress() {
        if (!gameActive || totalQ===0) return;
        const pct = (currentIndex/totalQ)*100;
        progressFill.style.width = pct+'%';
        ship.style.left = `calc(${Math.min(pct,96)}% - 20px)`;
    }

    function displayQuestion() {
        if (!gameActive || currentIndex >= totalQ) { finishGame(); return; }
        const q = problems[currentIndex];
        qText.innerHTML = renderMath(q.question);
        formatHint.textContent = q.formatHint || '';
        if (q.hint) {
            hintToggle.style.display='inline-block';
            hintBox.innerHTML = '💡 '+renderMath(q.hint);
            hintBox.style.display='none'; hintToggle.textContent = '💡 Show Hint';
        } else {
            hintToggle.style.display='none'; hintBox.style.display='none';
        }
        document.getElementById('questionCounter').textContent = `Question ${currentIndex+1} / ${totalQ}`;
        document.getElementById('scoreDisplay').textContent = `⭐ ${score} / ${totalQ}`;
        skipTally.textContent = skipped>0 ? `Skipped: ${skipped}` : '';
        feedback.textContent=''; answerInput.value=''; answerInput.disabled=false;
        submitBtn.disabled=false; skipBtn.disabled=false;
        answerInput.focus();
        updateProgress();
    }

    function checkAnswer() {
        if (!gameActive) return;
        const user = answerInput.value.trim();
        if (!user) { feedback.innerHTML='🦜 Enter an answer!'; return; }
        const q = problems[currentIndex];
        if (answersMatch(user, q.answer, q.tolerance)) {
            score++;
            feedback.innerHTML = `✅ Correct! ${q.explanation ? renderMath(q.explanation) : ''}`;
            document.getElementById('scoreDisplay').textContent = `⭐ ${score} / ${totalQ}`;
            setTimeout(() => { currentIndex++; displayQuestion(); }, 1400);
        } else {
            feedback.innerHTML = '❌ Not quite. Try again.';
            if (q.hint) { hintBox.style.display='block'; hintToggle.textContent='💡 Hide Hint'; }
            answerInput.value=''; answerInput.focus();
        }
    }

    function skipQuestion() {
        if (!gameActive) return;
        skipped++;
        feedback.innerHTML = `⏭ Skipped. Answer: <strong>${problems[currentIndex].answer}</strong>.`;
        submitBtn.disabled = skipBtn.disabled = true;
        skipTally.textContent = `Skipped: ${skipped}`;
        setTimeout(() => { currentIndex++; displayQuestion(); }, 2000);
    }

    function finishGame() {
        gameActive = false;
        ship.style.left = 'calc(100% - 48px)';
        progressFill.style.width = '100%';
        const pct = totalQ>0 ? Math.round((score/totalQ)*100) : 0;
        qText.innerHTML = `<h2>🏆 Treasure Found!</h2><p>You scored ${score}/${totalQ} (${pct}%)</p>`;
        answerInput.style.display='none'; submitBtn.style.display='none'; skipBtn.style.display='none';
        restartBtn.style.display='inline-block';
    }

    function restart() {
        gameActive = false;
        gameScreen.style.display='none';
        codeScreen.style.display='block';
        answerInput.style.display=''; submitBtn.style.display=''; skipBtn.style.display='';
        codeInput.value=''; codeError.textContent='';
        progressFill.style.width='0%'; ship.style.left='5%';
        codeInput.focus();
    }

    async function loadWorksheet(code) {
        const upper = code.toUpperCase().trim();
        if (!upper) return;
        codeError.textContent = '';
        const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}/${WORKSHEET_PATH}/${upper}.json`;
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Worksheet "${upper}" not found (HTTP ${res.status}).`);
            const ws = await res.json();
            if (!ws.title || !ws.problems || ws.problems.length===0) throw new Error('Invalid worksheet format.');
            problems = ws.problems;
            totalQ = problems.length;
            currentIndex = 0; score = 0; skipped = 0;
            gameActive = true;
            codeScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            gameTitle.innerHTML = `${ws.themeEmoji||'⛵'} ${ws.title}`;
            restartBtn.style.display = 'none';
            displayQuestion();
        } catch(e) {
            codeError.innerHTML = `☠️ ${e.message}`;
            console.error(e);
        }
    }

    // Events
    document.getElementById('activateBtn').addEventListener('click',()=>loadWorksheet(codeInput.value.trim()));
    codeInput.addEventListener('keypress',e=>{ if(e.key==='Enter') loadWorksheet(codeInput.value.trim()); });
    submitBtn.addEventListener('click',checkAnswer);
    answerInput.addEventListener('keypress',e=>{ if(e.key==='Enter') checkAnswer(); });
    skipBtn.addEventListener('click',skipQuestion);
    restartBtn.addEventListener('click',restart);
    hintToggle.addEventListener('click',()=>{
        if (hintBox.style.display==='block') { hintBox.style.display='none'; hintToggle.textContent='💡 Show Hint'; }
        else { hintBox.style.display='block'; hintToggle.textContent='💡 Hide Hint'; }
    });
    window.useCode = (c)=>{ codeInput.value=c; codeInput.focus(); };
    codeInput.focus();
})();
</script>
</body>
</html>
